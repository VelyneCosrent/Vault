name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak zip
        run: |
          ls -la
          for z in *.zip; do unzip -qo "$z"; done
          ls -la VideoVault
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle :app:assembleDebug
        working-directory: VideoVault
      - uses: actions/upload-artifact@v4
        with:
          name: VideoVault-apk
          path: VideoVault/app/build/outputs/apk/debug/app-debug.apk
